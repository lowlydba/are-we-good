name: are-we-good
description: >
  Rolls up GitHub Actions job statuses into one check. Run as a final job
  so branch protection only needs one required check.
author: lowlydba
branding:
  icon: check-circle
  color: green

inputs:
  jobs:
    description: >
      JSON string of job results — pass via `toJSON(needs)` from the
      calling workflow. Shape: { [jobName]: { result: string } }
    required: true
  allowed-to-skip:
    description: >
      Comma-separated list of job names whose "skipped" result is acceptable.
      Defaults to "*" (all jobs may be skipped).
    required: false
    default: ""
  allowed-to-cancel:
    description: >
      Comma-separated list of job names whose "cancelled" result is acceptable.
      Defaults to "" (cancelled jobs cause failure unless listed here).
    required: false
    default: ""
  allowed-to-fail:
    description: >
      Comma-separated list of job names whose "failure" result is acceptable.
      Defaults to "" (failed jobs cause failure unless listed here).
    required: false
    default: ""
  summary:
    description: >
      Write a markdown results table to the GitHub Actions step summary.
      Set to "false" to disable.
    required: false
    default: "true"
  notify-ubuntu-slim:
    description: >
      Emit a notice recommending ubuntu-slim when running on a GitHub-hosted
      ubuntu-latest runner, to help right-size compute for this lightweight
      action. Set to "false" to disable.
    required: false
    default: "true"
  create-check-run:
    description: >
      Create a standalone check run via the GitHub Checks API, named
      uniquely per workflow by default (see check-name). Use this to avoid
      the native job-level check name colliding across workflows that call
      this action from a same-named job — branch protection would otherwise
      treat those as one check, satisfied by either one succeeding. Requires
      github-token and a "checks: write" permission. Set to "true" to enable.
    required: false
    default: "false"
  check-name:
    description: >
      Name for the check run created when create-check-run is enabled.
      Defaults to "<workflow name> / are-we-good", which is unique per
      workflow with no configuration needed. Set to override.
    required: false
    default: ""
  github-token:
    description: >
      Token used to create the check run via the Checks API when
      create-check-run is enabled, e.g. the workflow's default GITHUB_TOKEN.
      Requires "checks: write" permission.
    required: false
    default: ""

outputs:
  result:
    description: '"success" | "failure"'
  are-we-good:
    description: '"true" | "false"'

runs:
  using: node24
  main: dist/main.js
